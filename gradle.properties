pluginVersion=1.1.0

# The plugin is built against a locally installed IntelliJ IDEA instead of a downloaded one.
platformLocalPath=C:/Program Files/JetBrains/IntelliJ IDEA 2025.3

# IntelliJ 2026.2 is compiled for Java 25; its bundled runtime (JBR) serves as the toolchain.
org.gradle.java.installations.paths=C:/Program Files/JetBrains/IntelliJ IDEA 2025.3/jbr
org.gradle.java.installations.auto-download=false

# The IDE ships the Kotlin standard library; the plugin must not bundle its own.
kotlin.stdlib.default.dependency=false

org.gradle.configuration-cache=true
org.gradle.caching=true
