pluginVersion=1.3.0

# The IntelliJ IDEA the plugin is built against; Gradle downloads it once and keeps it in its cache.
platformVersion=2026.2.3

# The IDE ships the Kotlin standard library; the plugin must not bundle its own.
kotlin.stdlib.default.dependency=false

# CodeQL compiles the Kotlin code inside Gradle's own JVM, which the default 512 MB is too small for.
org.gradle.jvmargs=-Xmx4g

org.gradle.configuration-cache=true
org.gradle.caching=true
