<!doctype html><html lang="en"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Trace Tail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one log tail on white. Every request is a single folded line; opening it shows its
   START, END, method and call lines nested by span.id and parent.id. Light theme only, by request. */
:root {
  color-scheme: light;
  --bg: #ffffff;
  --ink: #1a2330;
  --muted: #5e6a77;
  --faint: #a3acb6;
  --line: #e7eaee;
  --guide: #dfe4e9;
  --hover: #f4f7f9;
  --open: #fafbfc;
  --accent: #0b6d89;
  --accent-soft: #e2f0f5;
  --ok: #1c7845;
  --warn: #9e5f0b;
  --warn-bg: #fdf6e8;
  --err: #bd3a2c;
  --err-bg: #fdf0ee;
  --debug: #6b60b2;
  --app-c: var(--muted);
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-log: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --font-display: "IBM Plex Sans Condensed", "IBM Plex Sans", "Arial Narrow", sans-serif;
  --indent: 20px;
  --cols: 12ch 5.5ch 11.5ch minmax(0, 1fr);
}

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font-ui); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 1600px; margin: 0 auto; padding-inline: 16px; }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding-block: 10px 8px; }
h1 { margin: 0; font: 600 20px/1.1 var(--font-display); letter-spacing: 0.005em; }
.tag { font: 500 10.5px/1 var(--font-log); text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 4px 8px; }
.live { display: inline-flex; align-items: center; gap: 6px; font: 500 12px/1 var(--font-log); color: var(--accent); }
.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: pulse 1.4s ease-in-out infinite; }
.live.paused { color: var(--muted); }
.live.paused::before { animation: none; }
@keyframes pulse { 50% { opacity: 0.3; } }
.grow { flex: 1; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 30px; padding: 0 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); font-size: 13px; font-weight: 500; cursor: pointer; }
.btn:hover { border-color: var(--faint); background: var(--hover); }
#playBtn { min-width: 104px; }

/* shared line grid */
.cols, .ln, .xrow { display: grid; grid-template-columns: var(--cols); column-gap: 14px; padding-inline: 8px; }
.cols { padding-block: 6px; font: 600 10.5px/1 var(--font-display); text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); }

/* log */
.log { padding-block: 4px 96px; font: 12.5px/1.6 var(--font-log); font-variant-numeric: tabular-nums; }
.grp { border-bottom: 1px solid var(--line); }
.grp.open { background: var(--open); box-shadow: inset 2px 0 0 var(--accent); }
.ln { cursor: pointer; }
.ln > * { padding-block: 1px; }
.ln.root > * { padding-block: 6px; }
.ln:hover { background: var(--hover); }
.ln.lvl-WARN { background: var(--warn-bg); }
.ln.lvl-ERROR { background: var(--err-bg); }
.ln .ts { padding-inline: 0; border: 0; background: none; text-align: left; color: var(--muted); cursor: pointer; white-space: nowrap; }
.ln .ts:hover { color: var(--accent); }
.lv { font-weight: 600; color: var(--muted); }
.lvl-DEBUG .lv { color: var(--debug); }
.lvl-WARN .lv { color: var(--warn); }
.lvl-ERROR .lv { color: var(--err); }
.ap { color: var(--app-c); }
.ap-in { display: none; color: var(--app-c); }
.msg {
  min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 8px;
  padding-left: calc(var(--d) * var(--indent));
  background-image: repeating-linear-gradient(to right, transparent 0 7px, var(--guide) 7px 8px, transparent 8px var(--indent));
  background-size: calc(var(--d) * var(--indent)) 100%;
  background-repeat: no-repeat;
}
.fold { flex: none; align-self: flex-start; margin-top: 3px; width: 16px; height: 16px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 3px; background: transparent; color: var(--muted); cursor: pointer; }
.fold:hover { background: var(--line); color: var(--ink); }
.fold svg { transition: transform 0.15s; }
.fold.closed svg { transform: rotate(-90deg); }
.sp { flex: none; width: 16px; }
.ev { font-weight: 600; }
.tx { color: var(--ink); }
.ph { font-weight: 600; }
.ph.start { color: var(--accent); }
.ph.end { color: var(--muted); }
.kv { min-width: 0; color: var(--muted); overflow-wrap: anywhere; }
.kv b { font-weight: 500; color: var(--ink); }
.kv b.v-ok, .sum .v-ok { color: var(--ok); font-weight: 600; }
.kv b.v-warn, .sum .v-warn { color: var(--warn); font-weight: 600; }
.kv b.v-err, .sum .v-err { color: var(--err); font-weight: 600; }
.kv b.v-mute { color: var(--muted); font-weight: 600; }
.sum { margin-left: auto; display: inline-flex; flex-wrap: wrap; gap: 0 12px; font-size: 12px; color: var(--muted); }
.sum .v-run { color: var(--accent); font-weight: 600; }
.anno { cursor: default; }
.anno:hover { background: transparent; }
.anno em { font-style: italic; color: var(--muted); }
.anno.unf em { color: var(--err); }
.xrow > * { grid-column: -2 / -1; margin: 0 0 6px calc(var(--d) * var(--indent) + 24px); }
.stack { white-space: pre-wrap; overflow-wrap: anywhere; color: var(--err); font: 11.5px/1.5 var(--font-log); }
.jsonbox { padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); font-size: 11.5px; line-height: 1.55; overflow-wrap: anywhere; cursor: text; }
.jk { color: var(--muted); }
.js { color: var(--ink); }
.jnum { color: var(--accent); }
.jn { color: var(--faint); }
mark.idp { background: var(--accent-soft); color: inherit; border-radius: 3px; padding: 0 2px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
mark.idp .jk { color: var(--accent); font-weight: 600; }
.follow { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 6; height: 32px; padding: 0 14px; border: 1px solid var(--accent); border-radius: 999px; background: var(--bg); color: var(--accent); font-size: 13px; font-weight: 500; cursor: pointer; box-shadow: 0 2px 10px rgba(16, 32, 48, 0.12); }

@media (max-width: 700px) {
  :root { --cols: 12ch 5ch minmax(0, 1fr); --indent: 14px; }
  .ap, .cols .c-app { display: none; }
  .ap-in { display: inline; }
}
@media (prefers-reduced-motion: reduce) {
  .live::before { animation: none; }
  .fold svg { transition: none; }
}

/* ---- modes ---- */
[hidden] { display: none !important; }
:root {
  --t0: #0b6d89; --t1: #7d45ad; --t2: #a94e18; --t3: #1f7a4c; --t4: #a82f64; --t5: #4a59c2; --t6: #76690d; --t7: #137a79;
  --raw-bg: #f7f9fb;
}
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--bg); }
.seg button { height: 30px; padding: 0 12px; border: 0; background: transparent; font-size: 13px; font-weight: 500; color: var(--muted); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.seg button:focus-visible { outline-offset: -2px; }
.hint { font-size: 12px; color: var(--muted); }
.lvl-ctl { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.lvl-ctl label { font-size: 12.5px; color: var(--muted); }
.lvl-ctl select { height: 30px; padding: 0 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font: 13px var(--font-ui); }
#lvlSeg button { font: 500 11.5px/1 var(--font-log); padding: 0 9px; }
#lvlSeg button[data-level="DEBUG"][aria-pressed="true"] { color: var(--debug); background: color-mix(in srgb, var(--debug) 12%, var(--bg)); }
#lvlSeg button[data-level="WARN"][aria-pressed="true"] { color: var(--warn); background: var(--warn-bg); }
#lvlSeg button[data-level="ERROR"][aria-pressed="true"] { color: var(--err); background: var(--err-bg); }
@media (max-width: 700px) {
  #modeSeg { max-width: 100%; overflow-x: auto; }
  #modeSeg button { flex: none; padding: 0 9px; }
}

/* flat mode */
.flat .ln { cursor: default; transition: opacity 0.12s; }
.flat .ln > * { padding-block: 1px; }
.flat .msg { display: block; padding-left: 0; background: none; overflow-wrap: anywhere; color: var(--muted); }
.flat .msg .ev { font-weight: 600; color: var(--ink); }
.flat .msg .ph { margin-left: 8px; }
.flat .msg .ap-in { margin-right: 8px; }
.flat .msg b { font-weight: 500; color: var(--ink); }
.flat .msg b.v-ok { color: var(--ok); font-weight: 600; }
.flat .msg b.v-warn { color: var(--warn); font-weight: 600; }
.flat .msg b.v-err { color: var(--err); font-weight: 600; }
.flat .msg b.v-mute { color: var(--muted); font-weight: 600; }
.flat .tr { color: var(--tc); font-weight: 500; cursor: pointer; }
.flat .tr:hover { text-decoration: underline; }
.flat .xrow > * { margin-left: 0; }
.flat.dim .ln { opacity: 0.25; }

/* flow mode: every step drawn as a bracket from where it starts to where it ends */
.flow-key { display: flex; flex-wrap: wrap; gap: 6px 22px; margin: 10px 0 4px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 6px; font-size: 12.5px; color: var(--muted); }
.flow-key b { font: 600 12.5px var(--font-log); margin-right: 4px; }
.flow { padding-block: 4px 96px; font: 12.5px/1.75 var(--font-log); font-variant-numeric: tabular-nums; }
.fgrp { padding-block: 8px; border-bottom: 1px solid var(--line); }
.fl { display: grid; grid-template-columns: 12ch 11.5ch minmax(0, 1fr); column-gap: 14px; padding-inline: 8px; }
.fl:hover { background: var(--hover); }
.fl.lvl-WARN { background: var(--warn-bg); }
.fl.lvl-ERROR { background: var(--err-bg); }
.fl .ts { color: var(--muted); white-space: nowrap; }
.fx {
  min-width: 0; overflow-wrap: anywhere; color: var(--muted);
  padding-left: calc(var(--d) * 3ch);
  background-image: repeating-linear-gradient(to right, transparent 0 0.45ch, var(--faint) 0.45ch calc(0.45ch + 1.5px), transparent calc(0.45ch + 1.5px) 3ch);
  background-size: calc(var(--d) * 3ch) 100%;
  background-repeat: no-repeat;
}
.mk { font-weight: 600; color: var(--faint); white-space: pre; }
.mk.go { color: var(--accent); }
.mk.back { color: var(--ok); }
.mk.back.bad { color: var(--err); }
.mk.wait { color: var(--accent); }
.fx .say { font-weight: 600; color: var(--ink); }
.fx .who { color: var(--app-c); font-weight: 500; }
.fx .dur { color: var(--ink); }
.fx b { font-weight: 500; color: var(--ink); }
.fx b.v-ok, .fx .v-ok { color: var(--ok); font-weight: 600; }
.fx b.v-warn, .fx .v-warn { color: var(--warn); font-weight: 600; }
.fx b.v-err, .fx .v-err { color: var(--err); font-weight: 600; }
.fx b.v-mute { color: var(--muted); font-weight: 600; }
.fx .lost { color: var(--err); font-style: italic; }
.fx .pending { color: var(--accent); font-style: italic; }
@media (max-width: 700px) {
  .fl { grid-template-columns: 12ch minmax(0, 1fr); }
  .fl > .ap { display: none; }
}

/* sequence mode: every request's diagram, stacked and kept tight */
.seqs { padding-block: 2px 96px; }
.sqg { padding-block: 5px 6px; border-bottom: 1px solid var(--line); }
.sq-cap { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 12px; padding-inline: 8px; font: 11.5px/1.5 var(--font-log); color: var(--muted); }
.sq-cap b { font-weight: 600; color: var(--ink); }
.sq-cap .v-ok { color: var(--ok); font-weight: 600; }
.sq-cap .v-warn { color: var(--warn); font-weight: 600; }
.sq-cap .v-err { color: var(--err); font-weight: 600; }
.sq-cap .v-mute { color: var(--muted); font-weight: 600; }
.sq-cap .run { color: var(--accent); font-weight: 600; }
.mm-btn { margin-left: auto; height: 20px; padding: 0 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); font: 500 11px/1 var(--font-log); color: var(--muted); cursor: pointer; }
.mm-btn:hover { color: var(--accent); border-color: var(--accent); }
.sq-scroll { overflow-x: auto; padding: 3px 8px 0; }
.sqg pre.mm { margin: 6px 8px 0; padding: 8px 10px; max-height: 300px; overflow: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--raw-bg); font: 11.5px/1.5 var(--font-log); white-space: pre; }
.sq-defs { position: absolute; width: 0; height: 0; overflow: hidden; }
.seq-svg { display: block; font: 10.5px var(--font-log); }
.seq-svg text { fill: var(--ink); }
.sq-group { fill: var(--app-c); opacity: 0.07; }
.sq-life { stroke: var(--faint); stroke-width: 1; stroke-dasharray: 3 3; }
.sq-pbox { fill: var(--bg); stroke: var(--app-c); stroke-width: 1; }
.sq-pbox.ext { fill: var(--hover); stroke: var(--faint); }
.seq-svg .sq-pname { font-weight: 600; fill: var(--app-c); }
.seq-svg .sq-pname.ext { fill: var(--ink); }
.sq-act { fill: var(--bg); stroke: var(--app-c); stroke-width: 1; }
.sq-act.ext { stroke: var(--muted); }
.sq-act.open { stroke: var(--accent); stroke-dasharray: 2 2; }
.sq-act.lost { stroke: var(--err); }
.sq-call, .sq-async { fill: none; stroke: var(--ink); stroke-width: 1.1; }
.sq-ret { fill: none; stroke: var(--muted); stroke-width: 1; stroke-dasharray: 4 3; }
.sq-headf { fill: var(--ink); }
.sq-heado { fill: none; stroke: var(--muted); stroke-width: 1.3; }
.sq-heado.dark { stroke: var(--ink); }
.sq-lbl-bg { fill: var(--bg); opacity: 0.9; }
.seq-svg .sq-lbl.ret { fill: var(--muted); }
.seq-svg .sq-lbl.v-ok { fill: var(--ok); }
.seq-svg .sq-lbl.v-warn { fill: var(--warn); }
.seq-svg .sq-lbl.v-err { fill: var(--err); }
.seq-svg .sq-lbl.v-mute { fill: var(--muted); }
.seq-svg .sq-time { fill: var(--muted); font-size: 9.5px; }
.sq-note { fill: var(--accent-soft); }
.sq-note.WARN { fill: var(--warn-bg); stroke: var(--warn); stroke-width: 0.8; }
.sq-note.ERROR { fill: var(--err-bg); stroke: var(--err); stroke-width: 0.8; }
.seq-svg .sq-ntext { font-size: 10px; }
.sq-x { stroke: var(--err); stroke-width: 1.6; }
.seq-svg .sq-lost { fill: var(--err); font-style: italic; }
.seq-svg .sq-wait { fill: var(--accent); font-style: italic; }

/* waterfall mode: every step as a bar on its request's own time line */
.wfs { padding-block: 2px 96px; }
.wfg { padding-block: 5px 8px; border-bottom: 1px solid var(--line); }
.wf { margin-top: 3px; }
.wr { display: grid; grid-template-columns: 11ch minmax(0, min(32%, 46ch)) minmax(0, 1fr) 9ch; column-gap: 12px; align-items: center; padding-inline: 8px; font: 11.5px/18px var(--font-log); font-variant-numeric: tabular-nums; }
.wr:not(.w-axis):hover { background: var(--hover); }
.wr.lvl-WARN { background: var(--warn-bg); }
.wr.lvl-ERROR { background: var(--err-bg); }
.w-ap { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--app-c); }
.w-ap.ext { color: var(--muted); }
.w-nm {
  min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  padding-left: calc(var(--d) * 12px);
  background-image: repeating-linear-gradient(to right, transparent 0 5px, var(--guide) 5px 6px, transparent 6px 12px);
  background-size: calc(var(--d) * 12px) 100%;
  background-repeat: no-repeat;
}
.wr.root .w-nm { font-weight: 600; }
.wr.note .w-nm { color: var(--muted); }
.wr.note .w-nm b { font-weight: 600; color: var(--ink); }
.w-tk { position: relative; height: 18px; background-image: repeating-linear-gradient(to right, var(--line) 0 1px, transparent 1px var(--tick)); }
.w-bar { position: absolute; top: 4px; height: 10px; min-width: 2px; border-radius: 2px; background: var(--app-c); }
.w-bar.ext { background: repeating-linear-gradient(135deg, #aeb7c1 0 3px, #dde2e7 3px 6px); }
.w-bar.run { background: color-mix(in srgb, var(--app-c) 25%, var(--bg)); box-shadow: inset 0 0 0 1px var(--accent); }
.w-bar.ext.run { background: repeating-linear-gradient(135deg, #cfd6dd 0 3px, #eef1f4 3px 6px); }
.w-bar.lost { background: var(--err-bg); box-shadow: inset 0 0 0 1px var(--err); }
.w-bar.lost::after { content: "✕"; position: absolute; left: 100%; top: -4px; margin-left: 3px; font: 600 11px/18px var(--font-log); color: var(--err); }
.w-dot { position: absolute; top: 5px; width: 8px; height: 8px; margin-left: -4px; background: var(--ink); transform: rotate(45deg); }
.w-dot.WARN { background: var(--warn); }
.w-dot.ERROR { background: var(--err); }
.w-du { text-align: right; white-space: nowrap; color: var(--muted); }
.w-du.run { color: var(--accent); font-weight: 600; }
.w-du.lost { color: var(--err); font-style: italic; }
.wr .v-ok { color: var(--ok); font-weight: 600; }
.wr .v-warn { color: var(--warn); font-weight: 600; }
.wr .v-err { color: var(--err); font-weight: 600; }
.wr .v-mute { color: var(--muted); font-weight: 600; }
.w-axis { line-height: 14px; color: var(--faint); }
.w-axis .w-tk { height: 14px; background: none; }
.w-tick { position: absolute; top: 0; transform: translateX(-50%); font-size: 10px; white-space: nowrap; }
.w-tick.first { transform: none; }
.w-tick.last { transform: translateX(-100%); }
@media (max-width: 700px) {
  .wr { grid-template-columns: minmax(0, 40%) minmax(0, 1fr) 8ch; column-gap: 8px; }
  .w-ap, .w-tick.odd { display: none; }
}

/* raw mode: exactly what the apps send, one JSON object per line */
.raw { margin-block: 8px 96px; padding: 10px 12px; background: var(--raw-bg); border: 1px solid var(--line); border-radius: 6px; font: 12px/1.6 var(--font-log); color: var(--ink); }
.raw > div { white-space: pre-wrap; overflow-wrap: anywhere; padding-block: 1px; border-bottom: 1px solid var(--line); }
.raw > div:last-child { border-bottom: 0; }
.raw-note { margin: 10px 0 0; font-size: 12.5px; color: var(--muted); }
.raw-note code { font: 500 12px var(--font-log); color: var(--accent); }
</style>
<style id="hlStyle"></style>
<style id="appStyle"></style>

<header class="bar">
  <div class="wrap">
    <div class="bar-row">
      <h1>Live logs</h1>
      <span class="live" id="live">live</span>
      <div class="seg" role="group" aria-label="View" id="modeSeg">
        <button type="button" data-mode="tree" aria-pressed="true">Tree</button>
        <button type="button" data-mode="flat" aria-pressed="false">Flat</button>
        <button type="button" data-mode="flow" aria-pressed="false">Flow</button>
        <button type="button" data-mode="seq" aria-pressed="false">Sequence</button>
        <button type="button" data-mode="wf" aria-pressed="false">Waterfall</button>
        <button type="button" data-mode="raw" aria-pressed="false">Raw</button>
      </div>
      <div class="lvl-ctl">
        <label for="lvlApp">Level</label>
        <select id="lvlApp">
          <option value="all">All apps</option>
        </select>
        <div class="seg" role="group" aria-label="Level" id="lvlSeg">
          <button type="button" data-level="DEBUG" aria-pressed="false">DEBUG</button>
          <button type="button" data-level="INFO" aria-pressed="true">INFO</button>
          <button type="button" data-level="WARN" aria-pressed="false">WARN</button>
          <button type="button" data-level="ERROR" aria-pressed="false">ERROR</button>
        </div>
      </div>
      <span class="grow"></span>
      <button id="openBtn" class="btn" type="button">Expand all</button>
      <button id="playBtn" class="btn" type="button"></button>
    </div>
    <div class="cols" id="cols" aria-hidden="true"><span>Time</span><span>Level</span><span class="c-app">App</span><span>Message</span></div>
  </div>
</header>

<main class="wrap">
  <div id="viewTree" class="log" aria-label="Tree view"></div>
  <div id="viewFlat" class="log flat" aria-label="Flat view" hidden></div>
  <div id="viewFlowWrap" hidden>
    <div id="viewFlow" class="flow" aria-label="Flow view"></div>
  </div>
  <div id="viewSeqWrap" class="seqs" aria-label="Sequence diagrams" hidden></div>
  <div id="viewWfWrap" class="wfs" aria-label="Waterfall view" hidden></div>
  <svg class="sq-defs" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <marker id="sqh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="sq-headf"/></marker>
      <marker id="sqo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" class="sq-heado"/></marker>
      <marker id="sqa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" class="sq-heado dark"/></marker>
    </defs>
  </svg>
  <div id="viewRaw" hidden>
    <div id="rawLog" class="raw" aria-label="Raw log lines"></div>
  </div>
</main>
<button id="followBtn" class="follow" type="button" hidden>Jump to new lines</button>

<script>
(() => {
  'use strict';

  const $ = id => document.getElementById(id);
  const flowEl = $('viewFlow'), flowWrap = $('viewFlowWrap'), seqWrap = $('viewSeqWrap'), wfWrap = $('viewWfWrap');
  const treeEl = $('viewTree'), flatEl = $('viewFlat'), rawWrap = $('viewRaw'), rawEl = $('rawLog');
  const playBtn = $('playBtn'), openBtn = $('openBtn'), liveEl = $('live'), followBtn = $('followBtn'), hlStyle = $('hlStyle'), colsEl = $('cols');
  const appStyle = $('appStyle'), lvlApp = $('lvlApp'), lvlSeg = $('lvlSeg');
  const CHEV = '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5 6 7.5 9 4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const PAUSE = '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><rect x="2.5" y="2" width="2.6" height="8" rx="0.6" fill="currentColor"/><rect x="6.9" y="2" width="2.6" height="8" rx="0.6" fill="currentColor"/></svg>';
  const PLAY = '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3.5 2.3v7.4a.5.5 0 0 0 .76.43l6-3.7a.5.5 0 0 0 0-.86l-6-3.7a.5.5 0 0 0-.76.43z" fill="currentColor"/></svg>';

  /* ---------- time and text ---------- */
  const pad = (n, w = 2) => String(n).padStart(w, '0');
  const fmtLocal = ms => {
    const d = new Date(ms);
    return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()) + '.' + pad(d.getMilliseconds(), 3);
  };
  const fmtDur = ms => {
    if (ms == null || !isFinite(ms)) return '—';
    ms = Math.max(0, ms);
    return ms < 1000 ? Math.round(ms) + ' ms' : (ms / 1000).toFixed(ms < 10000 ? 2 : 1) + ' s';
  };
  const count = (n, one, many) => n + ' ' + (n === 1 ? one : many);
  const esc = v => String(v).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

  const state = { playing: true, openAll: false };

  /* ---------- a received line: one ECS JSON object, read into the fields the view works with ---------- */
  // Fields the view shows in their own place. Every other field is listed as key=value.
  const OWN_FIELDS = new Set([
    '@timestamp', 'log.level', 'message', 'ecs.version', 'service.name', 'event.dataset', 'host.name',
    'process.thread.name', 'log.logger', 'trace.id', 'span.id', 'parent.id', 'traceId', 'spanId',
    'event.action', 'phase', 'flow', 'user.id',
  ]);
  // The view knows four levels. TRACE shows as DEBUG and FATAL as ERROR; the JSON keeps the original.
  const LEVEL_OF = { TRACE: 'DEBUG', DEBUG: 'DEBUG', INFO: 'INFO', WARN: 'WARN', ERROR: 'ERROR', FATAL: 'ERROR' };
  const str = v => (v == null || v === '' ? null : String(v));
  function readLine(text) {
    let o;
    try { o = JSON.parse(text); } catch (e) { return null; }
    if (!o || typeof o !== 'object' || Array.isArray(o)) return null;
    const fields = {};
    for (const [k, v] of Object.entries(o)) {
      if (!OWN_FIELDS.has(k) && v != null) fields[k] = typeof v === 'object' ? JSON.stringify(v) : v;
    }
    if (fields.durationMs != null && isFinite(fields.durationMs)) fields.durationMs = Number(fields.durationMs);
    const ts = Date.parse(o['@timestamp']);
    const phase = str(o.phase);
    return {
      ts: isFinite(ts) ? ts : Date.now(),
      level: LEVEL_OF[String(o['log.level']).toUpperCase()] || 'INFO',
      app: str(o['service.name']) || '?',
      // Micrometer also puts the ids into the MDC under these names
      trace: str(o['trace.id']) || str(o.traceId),
      span: str(o['span.id']) || str(o.spanId),
      parent: str(o['parent.id']),
      event: str(o['event.action']),
      phase: phase === 'START' || phase === 'END' ? phase : null,
      user: str(o['user.id']),
      message: str(o.message) || '',
      fields,
      json: o,
      text,
    };
  }

  const HIDDEN_FIELDS = new Set(['startTime', 'error.stack_trace']);
  const ID_KEYS = new Set(['trace.id', 'span.id', 'parent.id']);
  // the same trace keeps the same colour
  const hueOf = id => {
    let h = 0;
    for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
    return h % 8;
  };
  const outCls = o => (o === 'SUCCESS' ? 'v-ok' : o === 'REJECTED' ? 'v-warn' : o === 'UNAUTHORIZED' ? 'v-mute' : 'v-err');
  const VALUE_CLS = {
    outcome: outCls,
    result: v => (v === 'PASSED' ? 'v-ok' : v === 'REJECTED' ? 'v-warn' : ''),
  };
  // a line without an event name, such as a library's own log, shows its message instead
  const evHTML = l => (l.event ? '<span class="ev">' + esc(l.event) + '</span>' : '<span class="tx">' + esc(l.message) + '</span>');
  function jsonHTML(l) {
    return '{' + Object.entries(l.json).map(([k, v]) => {
      const val = v === null ? '<span class="jn">null</span>'
        : typeof v === 'number' || typeof v === 'boolean' ? '<span class="jnum">' + v + '</span>'
        : '<span class="js">' + esc(JSON.stringify(typeof v === 'object' ? v : String(v))) + '</span>';
      const pair = '<span class="jk">' + esc(JSON.stringify(k)) + '</span>:' + val;
      return ID_KEYS.has(k) ? '<mark class="idp">' + pair + '</mark>' : pair;
    }).join(',') + '}';
  }
  function kvHTML(f) {
    return Object.entries(f)
      .filter(([k]) => !HIDDEN_FIELDS.has(k))
      .map(([k, v]) => {
        const c = VALUE_CLS[k] ? VALUE_CLS[k](v) : '';
        return esc(k) + '=<b' + (c ? ' class="' + c + '"' : '') + '>' + esc(v) + '</b>';
      }).join(' ');
  }

  /* ---------- level filter: hides the lines below the chosen level, the shown ones and the new ones ---------- */
  const LEVEL_RANK = { DEBUG: 0, INFO: 1, WARN: 2, ERROR: 3 };
  const appLevel = {};
  let allLevel = 'DEBUG';
  // A step whose START line is hidden still exists in the app. The lines inside it then hang under
  // the nearest shown ancestor.
  const skipped = new Map();
  const resolveSpan = span => { while (span && skipped.has(span)) span = skipped.get(span); return span; };
  function admit(l) {
    if (LEVEL_RANK[l.level] < LEVEL_RANK[appLevel[l.app]]) {
      if (l.phase === 'START') {
        skipped.set(l.span, resolveSpan(l.parent));
        if (skipped.size > 20000) skipped.delete(skipped.keys().next().value);
      }
      return null;
    }
    const span = l.phase ? l.span : resolveSpan(l.span) || l.span;
    const parent = l.phase ? resolveSpan(l.parent) : null;
    return span === l.span && parent === l.parent ? l : Object.assign({}, l, { span, parent });
  }

  /* ---------- apps: each service.name gets a colour and a filter entry when its first line arrives ---------- */
  const APP_COLORS = ['#5a4ec3', '#0a7864', '#9d3b84', '#a94e18', '#4a59c2', '#137a79', '#76690d', '#a82f64'];
  const apps = new Set();
  function addApp(app) {
    if (apps.has(app)) return;
    apps.add(app);
    appLevel[app] = allLevel;
    appStyle.textContent += '[data-app="' + CSS.escape(app) + '"] { --app-c: ' + APP_COLORS[(apps.size - 1) % APP_COLORS.length] + '; }\n';
    const o = document.createElement('option');
    o.value = app;
    o.textContent = app;
    lvlApp.appendChild(o);
  }

  let mode = 'tree';
  let lineSeq = 0, grew = false;
  const KEEP_MAX = 10000;
  const received = [];   // the lines a changed filter rebuilds the view from
  function receive(texts) {
    for (const text of texts) {
      const l = readLine(text);
      if (!l) continue;
      addApp(l.app);
      received.push(l);
      ingest(l);
    }
    if (received.length > KEEP_MAX) received.splice(0, received.length - KEEP_MAX);
  }
  function ingest(raw) {
    const l = admit(raw);
    if (!l) return;
    l.id = ++lineSeq;
    if (l.trace) addToTrace(l);   // a line outside any trace shows only in the flat and raw modes
    flatAppend(l);
    rawAppend(l);
    grew = true;
  }

  /* ---------- tree mode: built only from trace.id, span.id and parent.id ---------- */
  const traces = new Map();
  const order = [];
  const GROUP_MAX = 150;
  const UNFINISHED_AFTER = 30000;

  function addToTrace(l) {
    let tr = traces.get(l.trace);
    if (!tr) {
      tr = { id: l.trace, steps: new Map(), lines: [], levels: { DEBUG: 0, INFO: 0, WARN: 0, ERROR: 0 }, open: state.openAll, folded: new Set(), jsonOpen: new Set(), dirty: true, wasRunning: false };
      tr.el = document.createElement('section');
      tr.el.className = 'grp';
      tr.el.dataset.tid = l.trace;
      traces.set(l.trace, tr);
      order.push(tr);
      treeEl.appendChild(tr.el);
      tr.flowEl = document.createElement('section');
      tr.flowEl.className = 'fgrp';
      flowEl.appendChild(tr.flowEl);
      tr.flowDirty = true;
      tr.flowWasRunning = false;
      tr.seqEl = document.createElement('section');
      tr.seqEl.className = 'sqg';
      tr.seqEl.dataset.tid = l.trace;
      seqWrap.appendChild(tr.seqEl);
      tr.seqWasRunning = false;
      tr.wfEl = document.createElement('section');
      tr.wfEl.className = 'wfg';
      wfWrap.appendChild(tr.wfEl);
      tr.wfWasRunning = false;
      if (order.length > GROUP_MAX) {
        const old = order.shift();
        old.el.remove();
        old.flowEl.remove();
        old.seqEl.remove();
        old.wfEl.remove();
        traces.delete(old.id);
      }
    }
    tr.lines.push(l);
    tr.levels[l.level]++;
    let s = tr.steps.get(l.span);
    if (!s) {
      s = { id: l.span, parent: null, start: l.ts, end: null, notes: [], app: l.app, event: null };
      tr.steps.set(l.span, s);
    }
    if (l.phase === 'START') {
      s.start = l.ts; s.startLine = l; s.parent = l.parent; s.app = l.app; s.event = l.event;
    } else if (l.phase === 'END') {
      s.end = l.ts; s.endLine = l; s.outcome = l.fields.outcome; s.status = l.fields.status;
      if (!s.startLine) { s.start = l.ts - (l.fields.durationMs || 0); s.parent = l.parent; s.app = l.app; s.event = l.event; }
    } else {
      s.notes.push(l);
    }
    tr.dirty = true;
    tr.flowDirty = true;
    tr.seqDirty = true;
    tr.wfDirty = true;
  }

  function analyse(tr) {
    const kids = new Map(), roots = [];
    for (const s of tr.steps.values()) {
      if (s.parent && tr.steps.has(s.parent)) {
        let a = kids.get(s.parent);
        if (!a) kids.set(s.parent, (a = []));
        a.push(s);
      } else roots.push(s);
    }
    const byStart = (a, b) => a.start - b.start;
    roots.sort(byStart);
    kids.forEach(a => a.sort(byStart));
    const now = Date.now();
    let unfinished = 0, running = 0;
    const visit = (s, parentClosed) => {
      // A synchronous child cannot outlive its parent. MQ consumers run on their own.
      const sync = s.event !== 'MQ_IN';
      s.unfinished = s.end == null && ((sync && parentClosed) || now - s.start > UNFINISHED_AFTER);
      if (s.end == null && !s.unfinished) running++;
      if (s.unfinished) unfinished++;
      for (const c of kids.get(s.id) || []) visit(c, s.end != null || s.unfinished);
    };
    roots.forEach(r => visit(r, false));
    return { kids, roots, unfinished, running };
  }

  function blockCount(s, info) {
    let n = (s.startLine ? 1 : 0) + (s.endLine ? 1 : 0) + s.notes.length;
    for (const k of info.kids.get(s.id) || []) n += blockCount(k, info);
    return n;
  }

  function summaryHTML(tr, s, info, isRoot) {
    const parts = ['<span>' + count(isRoot ? tr.lines.length : blockCount(s, info), 'line', 'lines') + '</span>'];
    if (s.end != null) {
      parts.push('<span class="' + outCls(s.outcome) + '">' + esc(s.outcome || 'END') + (s.status ? ' ' + s.status : '') + '</span>');
      parts.push('<span>' + fmtDur(s.end - s.start) + '</span>');
    } else if (s.unfinished) {
      parts.push('<span class="v-err">no END</span>');
    } else {
      parts.push('<span class="v-run">running</span><span>' + fmtDur(Date.now() - s.start) + '</span>');
    }
    if (isRoot) {
      if (info.unfinished) parts.push('<span class="v-err">' + count(info.unfinished, 'step', 'steps') + ' unfinished</span>');
      if (info.running && s.end != null) parts.push('<span class="v-run">' + count(info.running, 'step', 'steps') + ' running</span>');
      if (tr.levels.ERROR) parts.push('<span class="v-err">' + tr.levels.ERROR + ' ERROR</span>');
      if (tr.levels.WARN) parts.push('<span class="v-warn">' + tr.levels.WARN + ' WARN</span>');
    }
    return '<span class="sum">' + parts.join('') + '</span>';
  }

  // o is null for plain lines; for a START line it carries the step it opens.
  function treeLineHTML(tr, l, d, o) {
    const isRoot = !!(o && o.isRoot);
    const act = o ? (isRoot ? 'group' : 'fold') : 'json';
    const jsonOpen = tr.jsonOpen.has(l.id);
    const fold = o
      ? '<button class="fold' + (o.open ? '' : ' closed') + '" type="button" data-act="' + act + '" data-span="' + esc(o.step.id) + '" data-fk="f' + esc(o.step.id) + '" aria-expanded="' + o.open + '" aria-label="' + (o.open ? 'Collapse block' : 'Expand block') + '">' + CHEV + '</button>'
      : '<span class="sp"></span>';
    const ph = l.phase ? '<span class="ph ' + (l.phase === 'START' ? 'start' : 'end') + '">' + l.phase + '</span>' : '';
    const fields = isRoot ? Object.assign({}, l.fields, { user: l.user || '-', trace: l.trace.slice(0, 8) }) : l.fields;
    const sum = o && (isRoot || !o.open) ? summaryHTML(tr, o.step, o.info, isRoot) : '';
    const app = esc(l.app);
    let html = '<div class="ln lvl-' + l.level + (isRoot ? ' root' : '') + '" style="--d:' + d + '" data-act="' + act + '" data-span="' + esc(l.span) + '" data-line="' + l.id + '">' +
      '<button class="ts" type="button" data-act="json" data-line="' + l.id + '" data-fk="j' + l.id + '" aria-expanded="' + jsonOpen + '">' + fmtLocal(l.ts) + '</button>' +
      '<span class="lv">' + l.level + '</span>' +
      '<span class="ap" data-app="' + app + '">' + app + '</span>' +
      '<span class="msg">' + fold + '<span class="ap-in" data-app="' + app + '">' + app + '</span>' +
      evHTML(l) + ph + '<span class="kv">' + kvHTML(fields) + '</span>' + sum + '</span></div>';
    if (l.fields['error.stack_trace']) html += '<div class="xrow" style="--d:' + d + '"><pre class="stack">' + esc(l.fields['error.stack_trace']) + '</pre></div>';
    if (jsonOpen) html += '<div class="xrow" style="--d:' + d + '"><div class="jsonbox">' + jsonHTML(l) + '</div></div>';
    return html;
  }

  function annoHTML(s, d) {
    const text = s.unfinished ? 'END never came' : 'running · ' + fmtDur(Date.now() - s.start);
    return '<div class="ln anno' + (s.unfinished ? ' unf' : '') + '" style="--d:' + d + '"><span></span><span></span><span class="ap"></span>' +
      '<span class="msg"><span class="sp"></span><em>' + text + '</em></span></div>';
  }

  function renderGroup(tr, info) {
    const active = document.activeElement;
    const fk = active && tr.el.contains(active) ? active.dataset.fk : null;
    const out = [];
    const body = (s, d) => {
      const items = (info.kids.get(s.id) || []).map(k => ({ t: k.start, k })).concat(s.notes.map(n => ({ t: n.ts, n })));
      items.sort((a, b) => a.t - b.t);
      for (const it of items) {
        if (it.k) walk(it.k, d, false);
        else out.push(treeLineHTML(tr, it.n, d, null));
      }
    };
    const walk = (s, d, isRoot) => {
      if (s.startLine) {
        const open = isRoot ? tr.open : !tr.folded.has(s.id);
        out.push(treeLineHTML(tr, s.startLine, d, { step: s, isRoot, open, info }));
        if (!open) return;
        body(s, d + 1);
        out.push(s.endLine ? treeLineHTML(tr, s.endLine, d, null) : annoHTML(s, d));
      } else {
        body(s, d + 1);
        if (s.endLine) out.push(treeLineHTML(tr, s.endLine, d, null));
      }
    };
    info.roots.forEach(r => walk(r, 0, true));
    tr.el.innerHTML = out.join('');
    tr.el.classList.toggle('open', tr.open);
    if (fk) {
      const el = tr.el.querySelector('[data-fk="' + CSS.escape(fk) + '"]');
      if (el) el.focus({ preventScroll: true });
    }
  }

  function renderTree(all) {
    for (const tr of order) {
      const info = analyse(tr);
      // running groups redraw every tick; one more redraw after the last step settles
      if (all || tr.dirty || info.running > 0 || tr.wasRunning) {
        renderGroup(tr, info);
        tr.dirty = false;
      }
      tr.wasRunning = info.running > 0;
    }
  }

  treeEl.addEventListener('click', e => {
    const a = e.target.closest('[data-act]');
    if (!a || !treeEl.contains(a)) return;
    if (a.tagName !== 'BUTTON') {
      const sel = window.getSelection && window.getSelection();
      if (sel && !sel.isCollapsed) return;   // the reader is selecting text
    }
    const g = a.closest('.grp');
    const tr = g && traces.get(g.dataset.tid);
    if (!tr) return;
    const act = a.dataset.act;
    if (act === 'group') {
      tr.open = !tr.open;
      follow = false;
    } else if (act === 'fold') {
      const id = a.dataset.span;
      if (tr.folded.has(id)) tr.folded.delete(id); else tr.folded.add(id);
    } else if (act === 'json') {
      const id = Number(a.dataset.line);
      if (tr.jsonOpen.has(id)) tr.jsonOpen.delete(id); else tr.jsonOpen.add(id);
    }
    tr.dirty = true;
    render();
  });

  /* ---------- flow mode: each step is a bracket from its START (┌) to its END (└) ---------- */
  const pair = (k, v, cls) => esc(k) + '=<b' + (cls ? ' class="' + cls + '"' : '') + '>' + esc(v) + '</b>';
  function flowParts(l) {
    const f = l.fields;
    const dur = f.durationMs != null ? ' · <span class="dur">' + fmtDur(f.durationMs) + '</span>' : '';
    const res = f.outcome ? ' · <span class="' + outCls(f.outcome) + '">' + esc((f.status ? f.status + ' ' : '') + f.outcome) + '</span>' : '';
    const bad = f.outcome && f.outcome !== 'SUCCESS';
    // the fields the line does not already show, such as business keys, follow at the end
    const others = shown => Object.keys(f).filter(k => !shown.includes(k) && !HIDDEN_FIELDS.has(k)).map(k => ' ' + pair(k, f[k])).join('');
    const END = ['status', 'outcome', 'durationMs'];
    const who = t => '<span class="who" data-app="' + (apps.has(t) ? esc(t) : '') + '">' + esc(t) + '</span>';
    switch (l.event + ':' + l.phase) {
      case 'HTTP_IN:START': return ['go', 'request received', ' ' + esc(f.route) + (l.user ? ' · user ' + esc(l.user) : '') + others(['route'])];
      case 'HTTP_IN:END': return ['back' + (bad ? ' bad' : ''), 'response sent', res + others(['route', ...END]) + dur];
      case 'HTTP_OUT:START': return ['go', 'call sent', ' → ' + who(f.target) + ' ' + esc(f.op) + others(['target', 'op'])];
      case 'HTTP_OUT:END': return ['back' + (bad ? ' bad' : ''), 'response received', ' ← ' + who(f.target) + res + others(['target', 'op', ...END]) + dur];
      case 'MQ_OUT:START': return ['go', 'publishing message', ' → queue ' + esc(f.queue) + others(['queue'])];
      case 'MQ_OUT:END': return ['back', 'message queued', others(['queue', ...END]) + dur];
      case 'MQ_IN:START': return ['go', 'message received', ' ← queue ' + esc(f.queue) + others(['queue'])];
      case 'MQ_IN:END': return ['back' + (bad ? ' bad' : ''), 'message processed', res + others(['queue', ...END]) + dur];
      case 'JOB:START': return ['go', 'scheduled job started', ' ' + esc(f.job) + others(['job'])];
      case 'JOB:END': return ['back' + (bad ? ' bad' : ''), 'job finished', res + others(['job', ...END]) + dur];
      case 'METHOD:START': return ['go', 'method called', ' ' + esc(f.method) + ' <span>' + esc(f.args || '') + '</span>' + others(['method', 'args'])];
      case 'METHOD:END': return f.exception
        ? ['back bad', 'method threw', ' ' + esc(f.method) + ' → <span class="' + outCls(f.outcome) + '">' + esc(f.exception) + '</span>' + others(['method', 'exception', ...END]) + dur]
        : ['back', 'method returned', ' ' + esc(f.method) + (f.result != null ? ' → ' + esc(f.result) : '') + others(['method', 'result', ...END]) + dur];
      default: return ['', esc(l.event || l.message), ' ' + kvHTML(f)];
    }
  }
  function flowLineHTML(l, d) {
    const [cls, sayText, rest] = flowParts(l);
    const mark = l.phase === 'START' ? '┌─▶ ' : l.phase === 'END' ? '└─◀ ' : '•   ';
    return '<div class="fl lvl-' + l.level + '" style="--d:' + d + '">' +
      '<span class="ts">' + fmtLocal(l.ts) + '</span>' +
      '<span class="ap" data-app="' + esc(l.app) + '">' + esc(l.app) + '</span>' +
      '<span class="fx"><span class="mk ' + cls + '">' + mark + '</span><span class="say">' + sayText + '</span>' + rest + '</span></div>';
  }
  function flowOpenEnd(s, d) {
    const text = s.unfinished
      ? '<span class="mk back bad">└─✕ </span><span class="lost">unfinished</span>'
      : '<span class="mk wait">└┄┄ </span><span class="pending">running · ' + fmtDur(Date.now() - s.start) + '</span>';
    return '<div class="fl" style="--d:' + d + '"><span></span><span class="ap"></span><span class="fx">' + text + '</span></div>';
  }
  function renderFlowGroup(tr, info) {
    const out = [];
    const body = (s, d) => {
      const items = (info.kids.get(s.id) || []).map(k => ({ t: k.start, k })).concat(s.notes.map(n => ({ t: n.ts, n })));
      items.sort((a, b) => a.t - b.t);
      for (const it of items) {
        if (it.k) walk(it.k, d);
        else out.push(flowLineHTML(it.n, d));
      }
    };
    const walk = (s, d) => {
      if (s.startLine) {
        out.push(flowLineHTML(s.startLine, d));
        body(s, d + 1);
        out.push(s.endLine ? flowLineHTML(s.endLine, d) : flowOpenEnd(s, d));
      } else {
        body(s, d);
        if (s.endLine) out.push(flowLineHTML(s.endLine, d));
      }
    };
    info.roots.forEach(r => walk(r, 0));
    tr.flowEl.innerHTML = out.join('');
  }
  function renderFlow(all) {
    for (const tr of order) {
      const info = analyse(tr);
      if (all || tr.flowDirty || info.running > 0 || tr.flowWasRunning) {
        renderFlowGroup(tr, info);
        tr.flowDirty = false;
      }
      tr.flowWasRunning = info.running > 0;
    }
  }

  /* ---------- sequence diagrams: every request drawn from its own lines, stacked ---------- */
  const EXT_LABEL = { 'ext:User': 'User', 'ext:Scheduler': 'Scheduler', 'ext:RabbitMQ': 'RabbitMQ' };
  const SQ = { rowH: 20, top: 34, gutter: 50, minCol: 64, font: 10.5 };
  const tw = (t, size) => String(t).length * (size || SQ.font) * 0.6;   // IBM Plex Mono advance is 0.6 em
  const stepFields = s => ((s.startLine || s.endLine || {}).fields) || {};
  const plainKV = f => Object.entries(f).filter(([k]) => !HIDDEN_FIELDS.has(k)).map(([k, v]) => k + '=' + v).join(' ');

  function seqName(s) {
    if (!s) return '…';
    const f = stepFields(s);
    if (s.event === 'JOB') return 'JOB ' + f.job;
    if (s.event === 'HTTP_IN') return f.route || 'HTTP';
    return s.event || '…';
  }
  function seqStatus(info) {
    const r = info.roots[0];
    if (!r || r.end == null) return r && r.unfinished ? ['v-err', 'unfinished'] : ['run', 'running'];
    return [outCls(r.outcome), (r.status ? r.status + ' ' : '') + (r.outcome || 'END')];
  }
  function callLabel(s, l) {
    const f = l.fields;
    switch (s.event) {
      case 'HTTP_IN': return f.route || 'HTTP';
      case 'HTTP_OUT': return f.op || 'call';
      case 'MQ_OUT':
      case 'MQ_IN': return f.queue || 'queue';
      case 'JOB': return f.job || 'job';
      case 'METHOD': { const m = String(f.method || ''); return m.slice(m.indexOf('.') + 1) + '()'; }
      default: return l.event || '…';
    }
  }
  function retLabel(s, l) {
    const f = l.fields;
    const dur = f.durationMs != null ? ' · ' + fmtDur(f.durationMs) : '';
    if (s.event === 'METHOD') return f.exception ? ['✕ ' + f.exception + dur, outCls(f.outcome)] : ['returned' + dur, 'ret'];
    if (s.event === 'MQ_OUT') return ['queued' + dur, 'ret'];
    if (s.event === 'MQ_IN') return ['ack' + dur, f.outcome && f.outcome !== 'SUCCESS' ? outCls(f.outcome) : 'ret'];
    if (s.event === 'JOB') return ['done' + dur, f.outcome && f.outcome !== 'SUCCESS' ? outCls(f.outcome) : 'ret'];
    const res = [f.status, f.outcome].filter(v => v != null).join(' ');
    return [(res || 'response') + dur, f.outcome ? outCls(f.outcome) : 'ret'];
  }
  // a note is kept short: its first two fields
  function noteKV(l) {
    const f = l.fields;
    return Object.keys(f).filter(k => !HIDDEN_FIELDS.has(k)).slice(0, 2).map(k => k + '=' + f[k]).join(' ');
  }
  function noteText(l) {
    const kv = noteKV(l);
    return (l.event || l.message) + (kv ? ' ' + kv : '');
  }
  // An HTTP_IN whose parent is an HTTP_OUT is the far end of that call: one call, drawn once.
  function mergedParent(steps, s) {
    const p = s.parent ? steps.get(s.parent) : null;
    return s.event === 'HTTP_IN' && p && p.event === 'HTTP_OUT' && p.startLine ? p : null;
  }

  // Turns one request's lines into lifelines, rows (call, return, note) and activation bars.
  function seqModel(tr) {
    const steps = tr.steps;
    const parentOf = s => (s.parent ? steps.get(s.parent) : null);
    const isMerged = s => !!mergedParent(steps, s);
    const mergedChildOf = new Map();
    for (const s of steps.values()) if (isMerged(s)) mergedChildOf.set(s.parent, s);
    const owner = s => {
      const f = stepFields(s);
      if (s.event === 'HTTP_OUT') return (apps.has(f.target) ? 'app:' : 'ext:') + f.target;
      if (s.event === 'MQ_OUT') return 'ext:RabbitMQ';
      if (s.event === 'METHOD') return 'cls:' + String(f.method || '?').split('.')[0];
      return 'app:' + s.app;
    };
    const caller = s => {
      const p = parentOf(s);
      if (p) return owner(p);
      if (s.event === 'HTTP_IN') return 'ext:User';
      if (s.event === 'JOB') return 'ext:Scheduler';
      if (s.event === 'MQ_IN') return 'ext:RabbitMQ';
      return 'app:' + s.app;
    };
    const keyApp = new Map();
    for (const s of steps.values()) if (s.event === 'METHOD') keyApp.set(owner(s), s.app);

    const rows = [], r0 = new Map(), r1 = new Map();
    for (const l of tr.lines) {
      const s = steps.get(l.span);
      if (!s) continue;
      if (l.phase === 'START') {
        if (isMerged(s)) { r0.set(s.id, r0.get(s.parent)); continue; }
        r0.set(s.id, rows.length);
        rows.push({ kind: 'call', from: caller(s), to: owner(s), s, l });
      } else if (l.phase === 'END') {
        if (isMerged(s)) continue;
        r1.set(s.id, rows.length);
        rows.push({ kind: 'ret', from: owner(s), to: caller(s), s, l });
      } else {
        rows.push({ kind: 'note', on: owner(s), s, l });
      }
    }

    const ownEnd = s => (isMerged(s) ? r1.get(s.parent) : r1.get(s.id));
    const acts = [], actOf = new Map();
    for (const s of steps.values()) {
      if (!r0.has(s.id) || mergedChildOf.has(s.id)) continue;
      let end = ownEnd(s);
      if (end == null && s.unfinished) {
        // nobody wrote its END: the bar stops where the nearest finished caller returned
        for (let p = parentOf(s); p && end == null; p = parentOf(p)) end = ownEnd(p);
      }
      const a = { s, on: owner(s), r0: r0.get(s.id), r1: end == null ? null : end, lost: !!s.unfinished, running: s.end == null && !s.unfinished, depth: 0 };
      acts.push(a);
      actOf.set(s.id, a);
    }
    for (const [pid, child] of mergedChildOf) if (actOf.has(child.id)) actOf.set(pid, actOf.get(child.id));
    acts.sort((a, b) => a.r0 - b.r0);
    const live = new Map();
    for (const a of acts) {
      const list = (live.get(a.on) || []).filter(e => e > a.r0);
      a.depth = list.length;
      list.push(a.r1 == null ? Infinity : a.r1);
      live.set(a.on, list);
    }

    // lifelines: first appearance, an app's classes kept next to the app
    const keys = [], seen = new Set();
    const touch = k => { if (k && !seen.has(k)) { seen.add(k); keys.push(k); } };
    for (const r of rows) {
      if (r.kind === 'note') touch(r.on);
      else { touch(r.from); touch(r.to); }
    }
    for (const a of acts) touch(a.on);
    const groupOf = k => (k.startsWith('app:') ? k.slice(4) : k.startsWith('cls:') ? keyApp.get(k) || k : k);
    const groups = [], members = new Map();
    for (const k of keys) {
      const g = groupOf(k);
      if (!members.has(g)) { members.set(g, []); groups.push(g); }
      members.get(g).push(k);
    }
    const parts = [];
    for (const g of groups) {
      const ks = members.get(g);
      const lead = ks.indexOf('app:' + g);
      if (lead > 0) ks.unshift(ks.splice(lead, 1)[0]);
      for (const k of ks) {
        const ext = k.startsWith('ext:');
        parts.push({ key: k, group: g, ext, app: ext ? null : g, label: EXT_LABEL[k] || k.slice(4) });
      }
    }
    return { tr, rows, acts, actOf, parts };
  }

  function seqSVG(m) {
    const { rows, acts, actOf, parts, tr } = m;
    if (!parts.length) return '';
    const idx = new Map(parts.map((p, i) => [p.key, i]));
    const colW = parts.map(p => Math.max(SQ.minCol, tw(p.label) + 14));
    // neighbouring lifelines move apart only as far as the labels between them need
    const gap = parts.map((p, i) => (i < parts.length - 1 ? colW[i] / 2 + colW[i + 1] / 2 + 8 : 0));
    for (const r of rows) {
      if (r.kind === 'note') continue;
      const a = idx.get(r.from), b = idx.get(r.to);
      if (a == null || b == null || a === b) continue;
      const lo = Math.min(a, b), hi = Math.max(a, b);
      const need = tw(r.kind === 'call' ? callLabel(r.s, r.l) : retLabel(r.s, r.l)[0]) + 22;
      let have = 0;
      for (let i = lo; i < hi; i++) have += gap[i];
      if (have < need) {
        const add = (need - have) / (hi - lo);
        for (let i = lo; i < hi; i++) gap[i] += add;
      }
    }
    const cx = [];
    let x = SQ.gutter + colW[0] / 2;
    parts.forEach((p, i) => { cx[i] = x; x += gap[i]; });
    const Y = i => SQ.top + i * SQ.rowH;
    const lastY = rows.length ? Y(rows.length - 1) : SQ.top;
    const endY = lastY + (acts.some(a => a.running || (a.lost && a.r1 == null)) ? 22 : 10);
    const t0 = tr.lines[0].ts;
    const appAttr = p => (p.app ? ' data-app="' + esc(p.app) + '"' : '');
    const out = [];
    let maxRight = cx[cx.length - 1] + colW[colW.length - 1] / 2;

    for (const g of new Set(parts.map(p => p.group))) {
      const ids = parts.map((p, i) => (p.group === g ? i : -1)).filter(i => i >= 0);
      if (ids.length < 2 || parts[ids[0]].ext) continue;
      const a = ids[0], b = ids[ids.length - 1];
      const gx = cx[a] - colW[a] / 2 + 2, gw = cx[b] + colW[b] / 2 - 2 - gx;
      out.push('<rect class="sq-group" data-app="' + esc(g) + '" x="' + gx + '" y="0" width="' + gw + '" height="' + (endY + 2) + '" rx="5"/>');
    }
    parts.forEach((p, i) => {
      out.push('<line class="sq-life" x1="' + cx[i] + '" y1="19" x2="' + cx[i] + '" y2="' + endY + '"/>');
      const w = Math.min(colW[i] - 6, tw(p.label) + 12);
      out.push('<rect class="sq-pbox' + (p.ext ? ' ext' : '') + '"' + appAttr(p) + ' x="' + (cx[i] - w / 2) + '" y="1" width="' + w + '" height="18" rx="4"/>');
      out.push('<text class="sq-pname' + (p.ext ? ' ext' : '') + '"' + appAttr(p) + ' x="' + cx[i] + '" y="13.5" text-anchor="middle">' + esc(p.label) + '</text>');
    });

    const actX = a => cx[idx.get(a.on)] - 4 + a.depth * 4;
    for (const a of acts) {
      const i = idx.get(a.on);
      if (i == null) continue;
      const p = parts[i];
      const y0 = Y(a.r0);
      const y1 = a.r1 != null ? Y(a.r1) : endY - 2;
      const cls = 'sq-act' + (p.ext ? ' ext' : '') + (a.lost ? ' lost' : a.running ? ' open' : '');
      out.push('<rect class="' + cls + '"' + appAttr(p) + ' x="' + actX(a) + '" y="' + y0 + '" width="8" height="' + Math.max(y1 - y0, 4) + '"/>');
      if (a.lost) {
        const xx = actX(a) + 4;
        out.push('<path class="sq-x" d="M' + (xx - 4) + ' ' + (y1 - 4) + ' l8 8 M' + (xx + 4) + ' ' + (y1 - 4) + ' l-8 8"/>');
        out.push('<text class="sq-lost" x="' + (xx + 8) + '" y="' + (y1 + 3.5) + '">bitmedi</text>');
        maxRight = Math.max(maxRight, xx + 8 + tw('unfinished'));
      } else if (a.running) {
        const xx = actX(a) + 12, txt = 'running ' + fmtDur(Date.now() - a.s.start);
        out.push('<text class="sq-wait" x="' + xx + '" y="' + (y1 - 1) + '">' + esc(txt) + '</text>');
        maxRight = Math.max(maxRight, xx + tw(txt));
      }
    }

    // arrows attach to the edge of the bar they leave from and the bar they land on
    const edge = (key, act, right) => {
      if (act && act.on === key) { const l = actX(act); return right ? l + 8 : l; }
      return cx[idx.get(key)];
    };
    rows.forEach((r, i) => {
      const y = Y(i);
      out.push('<text class="sq-time" x="2" y="' + (y + 3.5) + '">+' + fmtDur(r.l.ts - t0) + '</text>');
      const title = '<title>' + esc(fmtLocal(r.l.ts) + ' ' + r.l.level + ' ' + r.l.app + ' ' + (r.l.event || r.l.message) + (r.l.phase ? ' ' + r.l.phase : '') + ' ' + plainKV(r.l.fields)) + '</title>';
      if (r.kind === 'note') {
        const a = actOf.get(r.s.id);
        const nx = a && a.on === r.on ? actX(a) + 12 : cx[idx.get(r.on)] + 8;
        const text = noteText(r.l), w = tw(text, 10) + 10;
        out.push('<g>' + title + '<rect class="sq-note ' + r.l.level + '" x="' + nx + '" y="' + (y - 7) + '" width="' + w + '" height="14" rx="2"/>' +
          '<text class="sq-ntext" x="' + (nx + 5) + '" y="' + (y + 3.5) + '">' + esc(text) + '</text></g>');
        maxRight = Math.max(maxRight, nx + w);
        return;
      }
      const a = idx.get(r.from), b = idx.get(r.to);
      if (a == null || b == null) return;
      const call = r.kind === 'call';
      const srcAct = call ? actOf.get(r.s.parent) : actOf.get(r.s.id);
      const dstAct = call ? actOf.get(r.s.id) : actOf.get(r.s.parent);
      const [text, tone] = call ? [callLabel(r.s, r.l), ''] : retLabel(r.s, r.l);
      const async = call && r.s.event === 'MQ_IN';
      const lineCls = call ? (async ? 'sq-async' : 'sq-call') : 'sq-ret';
      const head = call ? (async ? 'url(#sqa)' : 'url(#sqh)') : 'url(#sqo)';
      let d, lx, ly, anchor;
      if (a === b) {
        // a call to the same lifeline loops out to the right and back into the nested bar
        const x1 = edge(r.from, srcAct, true), x2 = edge(r.to, dstAct, true);
        const xr = Math.max(x1, x2) + 14;
        d = 'M' + x1 + ' ' + (y - 4) + ' H' + xr + ' V' + (y + 4) + ' H' + x2;
        lx = xr + 4; ly = y + 3.5; anchor = 'start';
      } else {
        const right = b > a;
        const x1 = edge(r.from, srcAct, right), x2 = edge(r.to, dstAct, !right);
        d = 'M' + x1 + ' ' + y + ' H' + x2;
        lx = (x1 + x2) / 2; ly = y - 3; anchor = 'middle';
      }
      const w = tw(text) + 6;
      const bx = anchor === 'middle' ? lx - w / 2 : lx - 3;
      out.push('<g>' + title +
        '<path class="' + lineCls + '" d="' + d + '" marker-end="' + head + '"/>' +
        '<rect class="sq-lbl-bg" x="' + bx + '" y="' + (ly - 8.5) + '" width="' + w + '" height="11" rx="2"/>' +
        '<text class="sq-lbl ' + tone + '" x="' + lx + '" y="' + ly + '" text-anchor="' + anchor + '">' + esc(text) + '</text></g>');
      maxRight = Math.max(maxRight, bx + w);
    });

    const W = Math.ceil(maxRight + 8), H = endY + 4;
    return '<svg class="seq-svg" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Sequence diagram">' + out.join('') + '</svg>';
  }

  function mermaidText(m) {
    const id = new Map(m.parts.map((p, i) => [p.key, 'P' + i]));
    const clean = t => String(t).replace(/[;#\r\n]+/g, ' ').replace(/\s+/g, ' ').trim();
    const out = ['sequenceDiagram'];
    const size = new Map();
    for (const p of m.parts) size.set(p.group, (size.get(p.group) || 0) + 1);
    let g = null, inBox = false;
    for (const p of m.parts) {
      if (p.group !== g) {
        if (inBox) { out.push('    end'); inBox = false; }
        g = p.group;
        if (!p.ext && size.get(g) > 1) { out.push('    box rgb(244,247,250) ' + clean(g)); inBox = true; }
      }
      out.push('    ' + (p.key === 'ext:User' ? 'actor' : 'participant') + ' ' + id.get(p.key) + ' as ' + clean(p.label));
    }
    if (inBox) out.push('    end');
    const active = new Map();   // only deactivate what was activated, Mermaid rejects the rest
    for (const r of m.rows) {
      if (r.kind === 'note') { out.push('    Note right of ' + id.get(r.on) + ': ' + clean(noteText(r.l))); continue; }
      const a = id.get(r.from), b = id.get(r.to);
      if (r.kind === 'call') {
        out.push('    ' + a + (r.s.event === 'MQ_IN' ? '-)' : '->>') + b + ': ' + clean(callLabel(r.s, r.l)));
        if (m.actOf.has(r.s.id)) { out.push('    activate ' + b); active.set(r.to, (active.get(r.to) || 0) + 1); }
      } else {
        out.push('    ' + a + '-->>' + b + ': ' + clean(retLabel(r.s, r.l)[0]));
        if (m.actOf.has(r.s.id) && (active.get(r.from) || 0) > 0) { out.push('    deactivate ' + a); active.set(r.from, active.get(r.from) - 1); }
      }
    }
    for (const a of m.acts) if (a.lost) out.push('    Note over ' + id.get(a.on) + ': unfinished');
    return out.join('\n');
  }

  const userOf = tr => (tr.lines.find(l => l.user) || {}).user || 'anonymous';
  function capHTML(tr, info, extra) {
    const r = info.roots[0];
    const [cls, label] = seqStatus(info);
    const dur = !r ? '' : r.end != null ? fmtDur(r.end - r.start) : r.unfinished ? '' : fmtDur(Date.now() - r.start);
    return '<div class="sq-cap"><span>' + fmtLocal(tr.lines[0].ts) + '</span><b>' + esc(seqName(r)) + '</b>' +
      '<span>' + esc(userOf(tr)) + '</span><span class="' + cls + '">' + esc(label) + '</span><span>' + dur + '</span>' + extra + '</div>';
  }
  function seqCaption(tr, info) {
    return capHTML(tr, info, '<button class="mm-btn" type="button" data-act="mm">' + (tr.mmMsg || 'Mermaid') + '</button>');
  }
  function renderSeqGroup(tr, info) {
    const old = tr.seqEl.querySelector('.sq-scroll');
    const left = old ? old.scrollLeft : 0;
    const m = seqModel(tr);
    tr.seqEl.innerHTML = seqCaption(tr, info) + '<div class="sq-scroll">' + seqSVG(m) + '</div>' +
      (tr.mmOpen ? '<pre class="mm">' + esc(mermaidText(m)) + '</pre>' : '');
    if (left) tr.seqEl.querySelector('.sq-scroll').scrollLeft = left;
  }
  function renderSeqAll(all) {
    for (const tr of order) {
      const info = analyse(tr);
      // running diagrams redraw every tick; one more redraw after the last step settles
      if (all || tr.seqDirty || info.running > 0 || tr.seqWasRunning) {
        renderSeqGroup(tr, info);
        tr.seqDirty = false;
      }
      tr.seqWasRunning = info.running > 0;
    }
  }

  seqWrap.addEventListener('click', e => {
    const b = e.target.closest('[data-act="mm"]');
    if (!b) return;
    const tr = traces.get(b.closest('.sqg').dataset.tid);
    if (!tr) return;
    analyse(tr);
    const text = mermaidText(seqModel(tr));
    const show = () => { tr.mmOpen = !tr.mmOpen; tr.seqDirty = true; render(); };
    const copied = () => {
      tr.mmMsg = 'Copied';
      tr.seqDirty = true;
      render();
      setTimeout(() => { tr.mmMsg = null; tr.seqDirty = true; }, 1600);
    };
    try {
      navigator.clipboard.writeText(text).then(copied, show);
    } catch (err) {
      show();
    }
  });

  /* ---------- waterfall: every step as a bar on its request's own time line ---------- */
  function wfService(s, far) {
    if (s.event === 'HTTP_OUT') {
      const t = stepFields(s).target;
      if (far) return { label: far.app, app: far.app };
      if (apps.has(t)) return { label: t, app: t };
      return { label: EXT_LABEL['ext:' + t] || t || 'external system', ext: true };
    }
    if (s.event === 'MQ_OUT') return { label: 'RabbitMQ', ext: true };
    return { label: s.app, app: s.app };
  }
  function wfName(s, far) {
    const f = stepFields(s);
    switch (s.event) {
      case 'HTTP_IN': return f.route || 'HTTP';
      case 'HTTP_OUT': return far ? stepFields(far).route || f.op || 'call' : f.op || 'call';
      case 'MQ_OUT':
      case 'MQ_IN': return f.queue || 'queue';
      case 'JOB': return f.job || 'job';
      case 'METHOD': return f.method || 'method';
      default: return s.event || '…';
    }
  }
  // Steps and notes in reading order; a call and its far end share one row.
  function wfRows(tr, info) {
    const farOf = new Map();
    for (const s of tr.steps.values()) {
      const p = mergedParent(tr.steps, s);
      if (p) farOf.set(p.id, s);
    }
    const rows = [];
    const add = (s, d) => {
      const far = farOf.get(s.id) || null;
      const drawn = !!(s.startLine || s.endLine);
      if (drawn) rows.push({ s, far, d, svc: wfService(s, far) });
      const items = [];
      for (const k of info.kids.get(s.id) || []) if (k !== far) items.push({ t: k.start, k });
      for (const n of s.notes) items.push({ t: n.ts, n });
      if (far) {
        for (const k of info.kids.get(far.id) || []) items.push({ t: k.start, k });
        for (const n of far.notes) items.push({ t: n.ts, n });
      }
      items.sort((a, b) => a.t - b.t);
      const dd = drawn ? d + 1 : d;
      for (const it of items) {
        if (it.k) add(it.k, dd);
        else rows.push({ l: it.n, d: dd });
      }
    };
    info.roots.forEach(r => add(r, 0));
    return rows;
  }
  // a step nobody closed stops where its nearest finished caller stopped
  function lostEnd(tr, s) {
    for (let p = tr.steps.get(s.parent); p; p = tr.steps.get(p.parent)) if (p.end != null) return p.end;
    return tr.lines[tr.lines.length - 1].ts;
  }
  function niceStep(total, n) {
    const raw = Math.max(total / n, 1);
    const p = Math.pow(10, Math.floor(Math.log10(raw)));
    for (const m of [1, 2, 5]) if (m * p >= raw) return m * p;
    return 10 * p;
  }
  const tickLabel = ms => (ms === 0 ? '0' : ms < 1000 ? ms + ' ms' : String(+(ms / 1000).toFixed(1)) + ' s');

  function wfHTML(tr, info) {
    const rows = wfRows(tr, info);
    if (!rows.length) return '';
    const now = Date.now();
    let t0 = Infinity, t1 = -Infinity, prev = null;
    for (const r of rows) {
      if (r.l) { t0 = Math.min(t0, r.l.ts); t1 = Math.max(t1, r.l.ts); continue; }
      const s = r.s;
      r.state = s.end != null ? 'done' : s.unfinished ? 'lost' : 'run';
      r.a = s.start;
      r.b = Math.max(r.a, r.state === 'done' ? s.end : r.state === 'lost' ? lostEnd(tr, s) : now);
      t0 = Math.min(t0, r.a);
      t1 = Math.max(t1, r.b);
      // the service is named where it changes, so the eye can follow the request between apps
      r.showSvc = r.svc.label !== prev;
      prev = r.svc.label;
    }
    if (info.running > 0) t1 = Math.max(t1, now);
    const total = Math.max(t1 - t0, 1);
    const pct = v => (v / total * 100).toFixed(2) + '%';
    const step = niceStep(total, 5);
    const ticks = [];
    for (let v = 0, i = 0; v <= total; v += step, i++) {
      const x = v / total * 100;
      // narrow screens label every other tick
      const cls = (v === 0 ? ' first' : x > 88 ? ' last' : '') + (i % 2 ? ' odd' : '');
      ticks.push('<span class="w-tick' + cls + '" style="left:' + pct(v) + '">' + tickLabel(v) + '</span>');
    }
    const out = ['<div class="wf" style="--tick:' + (step / total * 100).toFixed(3) + '%">' +
      '<div class="wr w-axis"><span class="w-ap"></span><span></span><span class="w-tk">' + ticks.join('') + '</span><span></span></div>'];
    for (const r of rows) {
      if (r.l) {
        out.push('<div class="wr note lvl-' + r.l.level + '" style="--d:' + r.d + '"><span class="w-ap"></span>' +
          '<span class="w-nm"><b>' + esc(r.l.event || r.l.message) + '</b> ' + esc(noteKV(r.l)) + '</span>' +
          '<span class="w-tk"><span class="w-dot ' + r.l.level + '" style="left:' + pct(r.l.ts - t0) + '"></span></span><span class="w-du"></span></div>');
        continue;
      }
      const s = r.s, f = s.endLine ? s.endLine.fields : {};
      const bad = r.state === 'done' && f.outcome && f.outcome !== 'SUCCESS';
      const tag = bad ? ' <span class="' + outCls(f.outcome) + '">' + esc((f.status ? f.status + ' ' : '') + f.outcome) + '</span>' : '';
      const du = r.state === 'lost' ? ['lost', 'unfinished'] : r.state === 'run' ? ['run', fmtDur(now - r.a)] : [bad ? outCls(f.outcome) : '', fmtDur(r.b - r.a)];
      // a call's row carries the most severe line from either end
      const lvl = [s.startLine, s.endLine, r.far && r.far.startLine, r.far && r.far.endLine]
        .reduce((a, l) => (l && LEVEL_RANK[l.level] > LEVEL_RANK[a] ? l.level : a), 'DEBUG');
      out.push('<div class="wr lvl-' + lvl + (r.d === 0 ? ' root' : '') + '" style="--d:' + r.d + '"' + (r.svc.ext ? '' : ' data-app="' + esc(r.svc.app) + '"') + '>' +
        '<span class="w-ap' + (r.svc.ext ? ' ext' : '') + '">' + (r.showSvc ? esc(r.svc.label) : '') + '</span>' +
        '<span class="w-nm">' + esc(wfName(s, r.far)) + tag + '</span>' +
        '<span class="w-tk"><span class="w-bar' + (r.svc.ext ? ' ext' : '') + (r.state === 'done' ? '' : ' ' + r.state) +
        '" style="left:' + pct(r.a - t0) + ';width:' + pct(r.b - r.a) + '"></span></span>' +
        '<span class="w-du ' + du[0] + '">' + esc(du[1]) + '</span></div>');
    }
    out.push('</div>');
    return out.join('');
  }
  function renderWfAll(all) {
    for (const tr of order) {
      const info = analyse(tr);
      // running requests redraw every tick: their time line keeps growing
      if (all || tr.wfDirty || info.running > 0 || tr.wfWasRunning) {
        tr.wfEl.innerHTML = capHTML(tr, info, '') + wfHTML(tr, info);
        tr.wfDirty = false;
      }
      tr.wfWasRunning = info.running > 0;
    }
  }

  /* ---------- flat mode: lines in arrival order, nothing grouped ---------- */
  const LINE_MAX = 1500;
  const flatLines = new Map();
  function flatAppend(l) {
    const el = document.createElement('div');
    el.className = 'ln lvl-' + l.level;
    if (l.trace) el.dataset.t = l.trace;
    el.dataset.line = l.id;
    const ph = l.phase ? '<span class="ph ' + (l.phase === 'START' ? 'start' : 'end') + '">' + l.phase + '</span>' : '';
    const trace = l.trace ? ' <span class="tr" data-act="trace" style="--tc:var(--t' + hueOf(l.trace) + ')">trace=' + esc(l.trace.slice(0, 4)) + '</span>' : '';
    const user = l.user ? ' user=<b>' + esc(l.user) + '</b>' : '';
    const app = esc(l.app);
    el.innerHTML =
      '<button class="ts" type="button" data-act="json" aria-expanded="false">' + fmtLocal(l.ts) + '</button>' +
      '<span class="lv">' + l.level + '</span>' +
      '<span class="ap" data-app="' + app + '">' + app + '</span>' +
      '<span class="msg"><span class="ap-in" data-app="' + app + '">' + app + '</span>' +
      evHTML(l) + ph + trace + user + ' ' + kvHTML(l.fields) + '</span>';
    flatEl.appendChild(el);
    flatLines.set(l.id, l);
    if (l.fields['error.stack_trace']) {
      const x = document.createElement('div');
      x.className = 'xrow';
      if (l.trace) x.dataset.t = l.trace;
      x.innerHTML = '<pre class="stack">' + esc(l.fields['error.stack_trace']) + '</pre>';
      flatEl.appendChild(x);
    }
    while (flatEl.childElementCount > LINE_MAX) {
      const first = flatEl.firstElementChild;
      if (first.dataset.line) flatLines.delete(Number(first.dataset.line));
      first.remove();
    }
  }

  let hlId = null;
  function setHl(id) {
    hlId = id;
    flatEl.classList.toggle('dim', !!id);
    hlStyle.textContent = id ? '.flat.dim .ln[data-t="' + CSS.escape(id) + '"]{opacity:1}' : '';
  }
  flatEl.addEventListener('click', e => {
    const a = e.target.closest('[data-act]');
    if (!a) return;
    const row = a.closest('.ln');
    if (a.dataset.act === 'trace') {
      setHl(hlId === row.dataset.t ? null : row.dataset.t);
      return;
    }
    const next = row.nextElementSibling;
    if (next && next.classList.contains('json-row')) {
      next.remove();
      a.setAttribute('aria-expanded', 'false');
      return;
    }
    const l = flatLines.get(Number(row.dataset.line));
    if (!l) return;
    const x = document.createElement('div');
    x.className = 'xrow json-row';
    if (l.trace) x.dataset.t = l.trace;
    x.innerHTML = '<div class="jsonbox">' + jsonHTML(l) + '</div>';
    row.after(x);
    a.setAttribute('aria-expanded', 'true');
    follow = false;
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && hlId) setHl(null); });

  /* ---------- raw mode: the JSON line exactly as written ---------- */
  function rawAppend(l) {
    const el = document.createElement('div');
    el.textContent = l.text;
    rawEl.appendChild(el);
    while (rawEl.childElementCount > LINE_MAX) rawEl.firstElementChild.remove();
  }

  /* ---------- mode switching, following, rendering ---------- */
  const MODES = ['tree', 'flat', 'flow', 'seq', 'wf', 'raw'];
  const nearBottom = () => window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 48;
  let follow = false;

  function setMode(m) {
    mode = m;
    treeEl.hidden = m !== 'tree';
    flatEl.hidden = m !== 'flat';
    rawWrap.hidden = m !== 'raw';
    flowWrap.hidden = m !== 'flow';
    seqWrap.hidden = m !== 'seq';
    wfWrap.hidden = m !== 'wf';
    colsEl.hidden = m !== 'tree' && m !== 'flat';
    openBtn.hidden = m !== 'tree';
    for (const b of $('modeSeg').querySelectorAll('button')) b.setAttribute('aria-pressed', String(b.dataset.mode === m));
    try { localStorage.setItem('log-view-mode', m); } catch (e) { /* storage may be blocked */ }
    if (m === 'tree') renderTree(true);
    if (m === 'flow') renderFlow(true);
    if (m === 'seq') renderSeqAll(true);
    if (m === 'wf') renderWfAll(true);
    follow = m === 'flat' || m === 'raw';
    window.scrollTo(0, follow ? document.documentElement.scrollHeight : 0);
    render();
  }
  $('modeSeg').addEventListener('click', e => {
    const b = e.target.closest('button[data-mode]');
    if (b && b.dataset.mode !== mode) setMode(b.dataset.mode);
  });

  function render() {
    if (mode === 'tree') renderTree(false);
    if (mode === 'flow') renderFlow(false);
    if (mode === 'seq') renderSeqAll(false);
    if (mode === 'wf') renderWfAll(false);
    if (grew && follow) window.scrollTo(0, document.documentElement.scrollHeight);
    grew = false;
    followBtn.hidden = follow || nearBottom();
  }

  window.addEventListener('scroll', () => { follow = nearBottom(); }, { passive: true });
  followBtn.addEventListener('click', () => {
    follow = true;
    window.scrollTo(0, document.documentElement.scrollHeight);
    followBtn.hidden = true;
  });

  function updatePlay() {
    playBtn.innerHTML = state.playing ? PAUSE + '<span>Pause</span>' : PLAY + '<span>Resume</span>';
    liveEl.textContent = state.playing ? 'live' : 'paused';
    liveEl.classList.toggle('paused', !state.playing);
  }
  playBtn.addEventListener('click', () => {
    state.playing = !state.playing;
    updatePlay();
    if (state.playing) schedulePull(0);
  });

  function showLevel() {
    const a = lvlApp.value;
    const cur = a !== 'all' ? appLevel[a]
      : Object.values(appLevel).every(v => v === allLevel) ? allLevel : null;   // apps differ: nothing pressed
    for (const b of lvlSeg.querySelectorAll('button')) b.setAttribute('aria-pressed', String(b.dataset.level === cur));
  }
  lvlApp.addEventListener('change', showLevel);
  lvlSeg.addEventListener('click', e => {
    const b = e.target.closest('button[data-level]');
    if (!b) return;
    const a = lvlApp.value;
    if (a === 'all') allLevel = b.dataset.level;
    for (const app of apps) if (a === 'all' || a === app) appLevel[app] = b.dataset.level;
    showLevel();
    rebuild();
  });

  // draws every kept line again, so a changed filter applies to the lines already shown;
  // the requests the reader opened or folded stay that way
  function rebuild() {
    const was = new Map(order.map(tr => [tr.id, tr]));
    traces.clear();
    order.length = 0;
    skipped.clear();
    flatLines.clear();
    for (const el of [treeEl, flowEl, seqWrap, wfWrap, flatEl, rawEl]) el.textContent = '';
    for (const l of received) ingest(l);
    for (const tr of order) {
      const old = was.get(tr.id);
      if (old) { tr.open = old.open; tr.folded = old.folded; }
    }
    render();
  }

  openBtn.addEventListener('click', () => {
    state.openAll = !state.openAll;
    openBtn.textContent = state.openAll ? 'Collapse all' : 'Expand all';
    for (const tr of order) { tr.open = state.openAll; tr.dirty = true; }
    render();
  });

  /* ---------- lines from the IDE ---------- */
  // The plugin replaces the marker below with a call that hands over up to `max` of the lines received
  // since the previous call, as a JSON array of strings. Opened outside the IDE, the page stays empty.
  function pullFromIde(max, onLines, onFail) {
    /*TRACE_TAIL_BRIDGE*/
  }
  const PULL_MAX = 1000, PULL_EVERY = 250;
  let pullTimer = null, pulling = false;
  function schedulePull(ms) {
    clearTimeout(pullTimer);
    pullTimer = setTimeout(pull, ms);
  }
  function pull() {
    if (pulling || !state.playing) return;   // while paused the lines wait in the IDE
    pulling = true;
    pullFromIde(String(PULL_MAX), json => {
      pulling = false;
      let texts = [];
      try { texts = JSON.parse(json); } catch (e) { /* a broken batch is skipped */ }
      receive(texts);
      schedulePull(texts.length >= PULL_MAX ? 0 : PULL_EVERY);   // a full batch means more are waiting
    }, () => {
      pulling = false;
      schedulePull(PULL_EVERY);
    });
  }

  /* ---------- redraw: steps still running show their time so far ---------- */
  let lastRender = 0;
  function frame(now) {
    if (now - lastRender > 90) { render(); lastRender = now; }
    requestAnimationFrame(frame);
  }

  updatePlay();
  showLevel();
  let saved = 'tree';
  try { saved = localStorage.getItem('log-view-mode') || 'tree'; } catch (e) { /* storage may be blocked */ }
  setMode(MODES.includes(saved) ? saved : 'tree');
  requestAnimationFrame(frame);
  pull();
})();
</script>

</body></html>
