      // running requests redraw every tick: their time line keeps growing
      if (all || tr.wfDirty || info.running > 0 || tr.wfWasRunning) {
        tr.wfEl.innerHTML = capHTML(tr, info, '') + wfHTML(tr, info);
        tr.wfDirty = false;
      }
      tr.wfWasRunning = info.running > 0;
    }
  }

  /* ---------- flat mode: lines in arrival order, nothing grouped ---------- */
  const LINE_MAX = 1500;
  const flatLines = new Map();
  function flatAppend(l) {
    const el = document.createElement('div');
    el.className = 'ln lvl-' + l.level;
    el.dataset.t = l.trace;
    el.dataset.line = l.id;
    const ph = l.phase ? '<span class="ph ' + (l.phase === 'START' ? 'start' : 'end') + '">' + l.phase + '</span>' : '';
    const user = l.user ? ' user=<b>' + esc(l.user) + '</b>' : '';
    el.innerHTML =
      '<button class="ts" type="button" data-act="json" aria-expanded="false">' + fmtLocal(l.ts) + '</button>' +
      '<span class="lv">' + l.level + '</span>' +
      '<span class="ap" data-app="' + l.app + '">' + l.app + '</span>' +
      '<span class="msg"><span class="ap-in" data-app="' + l.app + '">' + l.app + '</span>' +
      '<span class="ev">' + l.event + '</span>' + ph +
      ' <span class="tr" data-act="trace" style="--tc:var(--t' + hueOf(l.trace) + ')">trace=' + l.trace.slice(0, 4) + '</span>' +
      user + ' ' + kvHTML(l.fields) + '</span>';
    flatEl.appendChild(el);
    flatLines.set(l.id, l);
    if (l.fields['error.stack_trace']) {
      const x = document.createElement('div');
      x.className = 'xrow';
      x.dataset.t = l.trace;
      x.innerHTML = '<pre class="stack">' + esc(l.fields['error.stack_trace']) + '</pre>';
      flatEl.appendChild(x);
    }
    while (flatEl.childElementCount > LINE_MAX) {
      const first = flatEl.firstElementChild;
      if (first.dataset.line) flatLines.delete(Number(first.dataset.line));
      first.remove();
    }
  }

  let hlId = null;
  function setHl(id) {
    hlId = id;
    flatEl.classList.toggle('dim', !!id);
    hlStyle.textContent = id ? '.flat.dim .ln[data-t="' + id + '"]{opacity:1}' : '';
  }
  flatEl.addEventListener('click', e => {
    const a = e.target.closest('[data-act]');
    if (!a) return;
    const row = a.closest('.ln');
    if (a.dataset.act === 'trace') {
      setHl(hlId === row.dataset.t ? null : row.dataset.t);
      return;
    }
    const next = row.nextElementSibling;
    if (next && next.classList.contains('json-row')) {
      next.remove();
      a.setAttribute('aria-expanded', 'false');
      return;
    }
    const l = flatLines.get(Number(row.dataset.line));
    if (!l) return;
    const x = document.createElement('div');
    x.className = 'xrow json-row';
    x.dataset.t = l.trace;
    x.innerHTML = '<div class="jsonbox">' + jsonHTML(l) + '</div>';
    row.after(x);
    a.setAttribute('aria-expanded', 'true');
    follow = false;
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && hlId) setHl(null); });

  /* ---------- raw mode: the JSON line exactly as written ---------- */
  function rawAppend(l) {
    const el = document.createElement('div');
    el.textContent = JSON.stringify(ecs(l));
    rawEl.appendChild(el);
    while (rawEl.childElementCount > LINE_MAX) rawEl.firstElementChild.remove();
  }

  /* ---------- mode switching, following, rendering ---------- */
  const MODES = ['tree', 'flat', 'flow', 'seq', 'wf', 'raw'];
  const nearBottom = () => window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 48;
  let follow = false;

  function setMode(m) {
    mode = m;
    treeEl.hidden = m !== 'tree';
    flatEl.hidden = m !== 'flat';
    rawWrap.hidden = m !== 'raw';
    flowWrap.hidden = m !== 'flow';
    seqWrap.hidden = m !== 'seq';
    wfWrap.hidden = m !== 'wf';
    colsEl.hidden = m !== 'tree' && m !== 'flat';
    openBtn.hidden = m !== 'tree';
    for (const b of $('modeSeg').querySelectorAll('button')) b.setAttribute('aria-pressed', String(b.dataset.mode === m));
    try { localStorage.setItem('log-view-mode', m); } catch (e) { /* storage may be blocked */ }
    if (m === 'tree') renderTree(true);
    if (m === 'flow') renderFlow(true);
    if (m === 'seq') renderSeqAll(true);
    if (m === 'wf') renderWfAll(true);
    follow = m === 'flat' || m === 'raw';
    window.scrollTo(0, follow ? document.documentElement.scrollHeight : 0);
    render();
  }
  $('modeSeg').addEventListener('click', e => {
    const b = e.target.closest('button[data-mode]');
    if (b && b.dataset.mode !== mode) setMode(b.dataset.mode);
  });

  function render() {
    if (mode === 'tree') renderTree(false);
    if (mode === 'flow') renderFlow(false);
    if (mode === 'seq') renderSeqAll(false);
    if (mode === 'wf') renderWfAll(false);
    if (grew && follow) window.scrollTo(0, document.documentElement.scrollHeight);
    grew = false;
    followBtn.hidden = follow || nearBottom();
  }

  window.addEventListener('scroll', () => { follow = nearBottom(); }, { passive: true });
  followBtn.addEventListener('click', () => {
    follow = true;
    window.scrollTo(0, document.documentElement.scrollHeight);
    followBtn.hidden = true;
  });

  function updatePlay() {
    playBtn.innerHTML = state.playing ? PAUSE + '<span>Duraklat</span>' : PLAY + '<span>Devam et</span>';
    liveEl.textContent = state.playing ? 'canlı' : 'duraklatıldı';
    liveEl.classList.toggle('paused', !state.playing);
  }
  playBtn.addEventListener('click', () => { state.playing = !state.playing; updatePlay(); });

  const lvlApp = $('lvlApp'), lvlSeg = $('lvlSeg');
  function showLevel() {
    const a = lvlApp.value;
    const vals = a === 'all' ? Object.values(appLevel) : [appLevel[a]];
    const cur = vals.every(v => v === vals[0]) ? vals[0] : null;   // apps differ: nothing pressed
    for (const b of lvlSeg.querySelectorAll('button')) b.setAttribute('aria-pressed', String(b.dataset.level === cur));
  }
  lvlApp.addEventListener('change', showLevel);
  lvlSeg.addEventListener('click', e => {
    const b = e.target.closest('button[data-level]');
    if (!b) return;
    const a = lvlApp.value;
    for (const app of Object.keys(appLevel)) if (a === 'all' || a === app) appLevel[app] = b.dataset.level;
    showLevel();
  });
  showLevel();

  openBtn.addEventListener('click', () => {
    state.openAll = !state.openAll;
    openBtn.textContent = state.openAll ? 'Hepsini kapat' : 'Hepsini aç';
    for (const tr of order) { tr.open = state.openAll; tr.dirty = true; }
    render();
  });

  /* ---------- clock ---------- */
  const RATE = 0.1;       // simulated ms per real ms: a 200 ms request takes about 2 s to watch
  const IDLE_MAX = 900;   // real ms of silence before the clock skips ahead to the next line
  let lastReal = performance.now(), lastRender = 0;
  function frame(now) {
    const dt = Math.min(now - lastReal, 250);
    lastReal = now;
    if (state.playing) {
      state.simNow += dt * RATE;
      spawnDue();
      const next = Math.min(queue.length ? queue[0].ts : Infinity, nextArrival);
      const gap = IDLE_MAX * RATE;
      if (next - state.simNow > gap) state.simNow = next - gap;
      drain();
    }
    if (now - lastRender > 90) { render(); lastRender = now; }
    requestAnimationFrame(frame);
  }

  function prewarm(count) {
    for (let i = 0; i < count; i++) {
      enqueue(nextScenario(nextArrival));
      nextArrival += ri(500, 900);
    }
    while (queue.length) {
      state.simNow = queue[0].ts;
      ingest(queue.shift());
    }
    state.simNow += 40;
    nextArrival = Math.max(nextArrival, state.simNow + 250);
  }

  updatePlay();
  prewarm(3);
  if (order[0]) order[0].open = true;
  let saved = 'tree';
  try { saved = localStorage.getItem('log-view-mode') || 'tree'; } catch (e) { /* storage may be blocked */ }
  setMode(MODES.includes(saved) ? saved : 'tree');
  requestAnimationFrame(frame);
})();
</script>

</body></html>
